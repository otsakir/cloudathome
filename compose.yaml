services:
  haproxy:
    build:
      context: .
      dockerfile: haproxy.dockerfile
    volumes:
      - ./docker/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    environment:
      CAH_HTTP_PORT: "${CAH_HTTP_PORT}"
      CAH_HTTPS_PORT: "${CAH_HTTPS_PORT}"
      HTTP_INBOUND_DEFAULT_PORT: "${HTTP_INBOUND_DEFAULT_PORT}"
      HTTPS_INBOUND_DEFAULT_PORT: "${HTTPS_INBOUND_DEFAULT_PORT}"
      HTTP_INBOUND_PORT_RANGE: "${HTTP_INBOUND_PORT_RANGE}"
      HTTPS_INBOUND_PORT_RANGE: "${HTTPS_INBOUND_PORT_RANGE}"
      TCP_PUBLIC_PORT_RANGE: "${TCP_PUBLIC_PORT_RANGE}"
      HAPROXY_API_PORT: "${HAPROXY_API_PORT}"
    ports:
      - "${CAH_HTTP_PORT}:${CAH_HTTP_PORT}"
      - "${CAH_HTTPS_PORT}:${CAH_HTTPS_PORT}"
      - "${HTTP_INBOUND_DEFAULT_PORT}:${HTTP_INBOUND_DEFAULT_PORT}"
      - "${HTTPS_INBOUND_DEFAULT_PORT}:${HTTPS_INBOUND_DEFAULT_PORT}"
      - "${TCP_PUBLIC_PORT_RANGE}:${TCP_PUBLIC_PORT_RANGE}"
      - "${HTTP_INBOUND_PORT_RANGE}:${HTTP_INBOUND_PORT_RANGE}"
      - "${HTTPS_INBOUND_PORT_RANGE}:${HTTPS_INBOUND_PORT_RANGE}"
    user: haproxy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${HAPROXY_API_PORT} || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s

    extra_hosts:
      - "host.docker.internal:host-gateway"  # map host machine to this container to allow accessing http://localhost:8443 now under http://host.docker.internal:8443

  tunnelagent:
    build:
      context: .
      dockerfile: django.dockerfile
    depends_on:
      haproxy:
        condition: service_healthy
    ports:
      - "${CAH_SSH_PORT}:22"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.docker_settings
      CAH_HTTP_PORT: "${CAH_HTTP_PORT}"
      CAH_HTTPS_PORT: "${CAH_HTTPS_PORT}"
      CAH_HOSTNAME: "${CAH_HOSTNAME}"
      BASE_DOMAIN_ALLOW_NON_REGISTRABLE: "${BASE_DOMAIN_ALLOW_NON_REGISTRABLE}"
      HTTP_INBOUND_DEFAULT_PORT: "${HTTP_INBOUND_DEFAULT_PORT}"
      HTTPS_INBOUND_DEFAULT_PORT: "${HTTPS_INBOUND_DEFAULT_PORT}"
      HTTP_INBOUND_PORT_RANGE: "${HTTP_INBOUND_PORT_RANGE}"
      HTTPS_INBOUND_PORT_RANGE: "${HTTPS_INBOUND_PORT_RANGE}"
      CAH_SSH_PORT: "${CAH_SSH_PORT}"
      HAPROXY_API_PORT: "${HAPROXY_API_PORT}"
      # MAX_HOME_COUNT and friends (fleet-size sizing) are intentionally not passed
      # here -- scripts/generate_fleet_config.py writes them to fleet_config.json
      # instead, mounted read-only below. See core/ssh/manage_home.py's module
      # docstring for why.
    cap_add:
      - NET_ADMIN
    volumes:
      - ./src:/opt/app
      - ./src/var:/opt/backend-var
      # Operator-supplied TLS cert/key gunicorn terminates CAH_HOSTNAME's HTTPS
      # with (fullchain.pem/privkey.pem) -- no ACME automation, drop files here
      # manually. Only reachable via HAProxy, never published directly.
      - ./docker/django/certs:/etc/cloudathome/certs:ro
      # Fleet-size config locked at install time by scripts/generate_fleet_config.py.
      # Read-only, so nothing inside the container (not even root -- no
      # CAP_SYS_ADMIN to remount) can change what manage_home.py trusts.
      # create_host_path: false makes `up` fail if the script hasn't been run,
      # instead of Docker silently creating an empty directory here.
      - type: bind
        source: ./fleet_config.json
        target: /etc/cloudathome/fleet_config.json
        read_only: true
        bind:
          create_host_path: false

