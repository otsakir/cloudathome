global
  maxconn 4096
  stats socket ipv4@0.0.0.0:$HAPROXY_API_PORT level admin
  log stdout format raw local0

resolvers docker
  nameserver dns1 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 10s
  hold obsolete 0s

defaults
  mode tcp
  timeout connect 5000ms
  timeout client 50000ms
  timeout server 50000ms
  option tcplog
  log global
  default-server init-addr none resolvers docker resolve-prefer ipv4

frontend https_frontend
  bind "*:$CAH_HTTPS_PORT"
  bind "*:$HTTPS_INBOUND_DEFAULT_PORT"
  bind "*:$HTTPS_INBOUND_PORT_RANGE"
  tcp-request inspect-delay 5s
  tcp-request content set-var(txn.dstport) dst_port
  tcp-request content accept if { req_ssl_hello_type 1 }
  use_backend %[req_ssl_sni,lower,concat(:,txn.dstport,),map(/usr/local/etc/haproxy/maps/sni_backends.map)]
  default_backend default_backend

backend default_backend
  server home host.docker.internal:8443

frontend tcp_public
  bind "*:$TCP_PUBLIC_PORT_RANGE"
  mode tcp
  use_backend %[dst_port,map_int(/usr/local/etc/haproxy/maps/tcp_backends.map)]
  default_backend tcp_no_match

backend tcp_no_match

frontend http_frontend
  bind "*:$CAH_HTTP_PORT"
  bind "*:$HTTP_INBOUND_DEFAULT_PORT"
  bind "*:$HTTP_INBOUND_PORT_RANGE"
  mode http
  http-request set-var(txn.dstport) dst_port
  # field(1,':') strips a port the client may already have included in Host --
  # required on any non-default port (80's conventional, so clients omit it
  # there, but MUST include it on a non-standard port per RFC 7230, e.g.
  # req.hdr(host) arrives as "host:81", not "host"). Without this, the
  # concat below doubles the port ("host:81:81"), never matching the seeded
  # "host:81" map key -> falls through to http_default_backend -> 503.
  use_backend %[req.hdr(host),lower,field(1,':'),concat(:,txn.dstport,),map(/usr/local/etc/haproxy/maps/host_http_backends.map)]
  default_backend http_default_backend

backend http_default_backend
  mode http

# Static backends for this instance's own Django (admin/API/web UI), routed
# here by hostname (see CAH_HOSTNAME in .env.example) -- the only way to reach
# Django now, there's no separate published port. Fixed names (not per-home
# generated) since there's only ever one of these per instance. Django runs
# under gunicorn, holding its own TLS cert, so cah_django_https_backend is
# plain passthrough (mode tcp, inherited from defaults) exactly like a home's
# own backend -- HAProxy never decrypts it. Map entries are seeded at
# container start by `manage.py reconcile_admin_route` (map files start empty
# on every restart, same as the per-home entries); which backend the HTTP map
# entry points to depends on whether a cert is present -- see
# HAProxyService.https_available.
backend cah_django_http_backend
  mode http
  server django tunnelagent:8000

# Used instead of cah_django_http_backend once a cert is present -- HTTP
# requests to CAH_HOSTNAME never reach Django at all, just bounce straight to
# HTTPS. No separate on/off setting: supplying a cert *is* turning this on.
backend cah_django_http_redirect_backend
  mode http
  http-request redirect scheme https code 301

backend cah_django_https_backend
  server django tunnelagent:8001

# BEGIN GENERATED BACKENDS
